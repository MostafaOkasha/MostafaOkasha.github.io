<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #0a192f; }
    a { color: #B0C6CE; text-decoration: none; }
    a:hover { color: #64ffda; }
    input::placeholder { color: #8892b0; }
  </style>
</helmet>

<div style="min-height: 100vh; font-family: 'Space Grotesk', sans-serif;">
  <!-- nav -->
  <div style="position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 20px 44px; border-bottom: 1px solid rgba(100,255,218,0.18); background: rgba(10,25,47,0.85); backdrop-filter: blur(8px);">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="Home.dc.html" style="display: flex;"><img src="images/m-logo.png" alt="M" style="height: 28px; filter: brightness(10);"></a>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8892b0;">~/library</span>
    </div>
    <div style="display: flex; gap: 26px; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">
      <a href="Library.dc.html" style="color: #64ffda;">library</a>
      <a href="Workshop.dc.html">workshop</a>
      <a href="Resume.dc.html">resume</a>
      <a href="Skills.dc.html">skills</a>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 69px);">
    <!-- shelves -->
    <div style="border-right: 1px solid rgba(100,255,218,0.15); padding: 28px 0;">
      <div style="padding: 0 28px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8892b0;">SHELVES</div>
      <div style="margin-top: 14px; display: flex; flex-direction: column;">
        <sc-for list="{{ shelves }}" as="sh" hint-placeholder-count="8">
          <div onClick="{{ sh.go }}" style="cursor: pointer; display: flex; justify-content: space-between; padding: 11px 28px; background: {{ sh.bg }}; border-left: 2px solid {{ sh.border }}; color: {{ sh.fg }}; font-size: 14.5px;">
            <span>{{ sh.label }}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{ sh.countColor }};">{{ sh.count }}</span>
          </div>
        </sc-for>
      </div>
      <div style="margin: 26px 28px 0 28px; border: 1px dashed rgba(100,255,218,0.3); border-radius: 10px; padding: 14px 16px; font-size: 12.5px; line-height: 1.6; color: #8892b0; font-family: 'IBM Plex Mono', monospace;">
        every entry is a markdown file with a type + topics. drop a file in /library, it appears here.
      </div>
    </div>

    <!-- entries -->
    <div style="padding: 28px 44px 60px 44px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="flex: 1; display: flex; align-items: center; gap: 10px; border: 1px solid rgba(100,255,218,0.3); border-radius: 8px; padding: 11px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; max-width: 460px;">
          <span style="color: #64ffda;">⌕</span>
          <input value="{{ query }}" onChange="{{ setQuery }}" placeholder="search the library…" style="flex: 1; background: transparent; border: none; outline: none; color: #e6f1ff; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">
          <span style="border: 1px solid #495670; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #8892b0;">⌘K</span>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8892b0;">{{ resultLabel }}</span>
      </div>

      <div style="margin-top: 20px; display: flex; flex-direction: column;">
        <sc-for list="{{ entries }}" as="e" hint-placeholder-count="8">
          <a href="#" style="display: grid; grid-template-columns: 128px 1fr auto; gap: 18px; align-items: baseline; padding: 17px 0; border-bottom: 1px solid rgba(100,255,218,0.12);" style-hover="background: rgba(100,255,218,0.04);">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{ e.color }}; border: 1px solid {{ e.borderColor }}; border-radius: 4px; padding: 3px 8px; text-align: center; align-self: center;">{{ e.badge }}</span>
            <span>
              <span style="display: block; font-size: 19px; font-weight: 600; color: #e6f1ff;">{{ e.title }}</span>
              <span style="display: block; margin-top: 4px; font-size: 14px; color: #8892b0;">{{ e.desc }}</span>
            </span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8892b0;">{{ e.meta }}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  state = { shelf: 'all', query: '' };

  data() {
    const T = {
      essay:   { badge: 'DEEP DIVE',  color: '#64ffda' },
      cs:      { badge: 'CS NOTES',   color: '#7cb7ff' },
      ml:      { badge: 'ML NOTES',   color: '#d8a3ff' },
      book:    { badge: 'BOOK',       color: '#7dead8' },
      paper:   { badge: 'PAPER',      color: '#ffd76b' },
      idea:    { badge: 'OPEN IDEA',  color: '#ffb26b' },
      refl:    { badge: 'REFLECTION', color: '#ff8ba3' },
      quote:   { badge: 'QUOTE',      color: '#B0C6CE' },
      spirit:  { badge: 'SPIRIT',     color: '#a8e6a3' },
      res:     { badge: 'RESOURCES',  color: '#e6d3a3' }
    };
    const E = [
      ['essay', 'Phone number tracing with software tools — the complete guide', 'OSINT from first principles: carriers, SS7, HLR lookups, and what actually works in 2026.', '18 min · jul \'26'],
      ['ml', 'Attention, from scratch, three ways', 'My working notes: numpy → einsum → the KV-cache view. With scribbles.', '12 min · jun \'26'],
      ['essay', 'The $10M spreadsheet: a banking war story', 'How currency-conversion losses hide in plain sight, and how I found them.', '11 min · may \'26'],
      ['paper', '"Attention Is All You Need" — annotated, 9 years on', 'The paper that started it, with margin notes on what held up and what didn\'t.', '8 min · jun \'26'],
      ['idea', 'Idea #11: an eval marketplace for agent tools', 'Free to build. Why it might work, why it might not, and how I\'d start.', '6 min · may \'26'],
      ['refl', 'On leaving big tech twice', 'A short escript on comfort, and the price of it.', '3 min · may \'26'],
      ['book', 'The Design of Everyday Things — summary + margin notes', 'Norman\'s principles, mapped to software I\'ve actually shipped.', '14 min · apr \'26'],
      ['cs', 'Operating systems, the parts that stuck', 'Scheduling, virtual memory, and why the page cache explains half of all perf bugs.', '16 min · apr \'26'],
      ['quote', '"The details are not the details." — Eames', 'Why I think this is the whole job, with three examples from CAD work.', '2 min · mar \'26'],
      ['spirit', 'Openings: notes on finding god in the ordinary', 'The first essay in a series I\'ve been afraid to publish.', '9 min · mar \'26'],
      ['res', 'The shortest path into ML engineering (2026 edition)', 'My curated route: 4 courses, 6 papers, 2 projects. Skip everything else.', 'map · feb \'26'],
      ['ml', 'Eval-driven development: a working method', 'Write the eval first. Everything else follows.', '7 min · feb \'26'],
      ['book', 'Siddhartha — what I underlined', 'Hesse on seeking vs. finding. Read in one sitting on a delayed flight.', '6 min · jan \'26'],
      ['idea', 'Idea #7: a git for CAD assemblies', 'Version control for atoms. The hard part is the diff.', '5 min · jan \'26'],
      ['cs', 'Networking notes: from socket to 5G scheduler', 'What writing RAN code taught me about every layer below HTTP.', '13 min · dec \'25'],
      ['refl', 'The barista principle', 'On talking to strangers, and what it does to your luck surface.', '3 min · dec \'25']
    ];
    return { T, E };
  }

  renderVals() {
    const { T, E } = this.data();
    const shelfDefs = [
      ['all', 'everything'], ['essay', 'essays & deep dives'], ['cs', 'CS curriculum'],
      ['ml', 'ML / AI notes'], ['book', 'book summaries'], ['paper', 'paper notes'],
      ['idea', 'open ideas'], ['refl', 'reflections'], ['quote', 'quotes + commentary'],
      ['spirit', 'spirituality'], ['res', 'resource maps']
    ];
    const q = this.state.query.toLowerCase();
    const filtered = E.filter(([type, title, desc]) =>
      (this.state.shelf === 'all' || type === this.state.shelf) &&
      (!q || (title + ' ' + desc).toLowerCase().includes(q))
    );
    return {
      query: this.state.query,
      setQuery: (ev) => this.setState({ query: ev.target.value }),
      resultLabel: filtered.length + ' of ' + E.length + ' entries',
      shelves: shelfDefs.map(([key, label]) => {
        const active = this.state.shelf === key;
        const count = key === 'all' ? E.length : E.filter(e => e[0] === key).length;
        return {
          label, count,
          bg: active ? 'rgba(100,255,218,0.08)' : 'transparent',
          border: active ? '#64ffda' : 'transparent',
          fg: active ? '#e6f1ff' : '#B0C6CE',
          countColor: active ? '#64ffda' : '#8892b0',
          go: () => this.setState({ shelf: key })
        };
      }),
      entries: filtered.map(([type, title, desc, meta]) => ({
        title, desc, meta,
        badge: T[type].badge,
        color: T[type].color,
        borderColor: T[type].color + '66'
      }))
    };
  }
}
</script>
</body>
</html>
