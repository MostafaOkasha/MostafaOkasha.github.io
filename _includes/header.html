<div class="jarallax">
    <header id="header" class="landing-header">
        <div class="wrapper">
            <div class="left">
                <a href="/" class="logo-container">
                <img class="logo" src="/images/m-logo.png" alt="Mostafa Okasha Brand Logo">
                </a>
                <div class="intro">
                    {% include header-intro.html %}
                </div>
            </div>
            <div class="right">
                {% include navigation_links.html %}
                <div class="commit-history">
                    Last updated with commit
                    <span class="commit-sha">
                        <a href="https://github.com/MostafaOkasha/mostafaokasha.github.io/commits/master" target="_blank">
                            @{{ site.github.build_revision | truncate: 7, "" }}
                        </a>
                    </span>
                </div>
            </div>
        </div>
    </header>

    <div class="vid-overlay">
        <div class="wrapper-pic animated fadeIn">
            <div class="profile-pic-container">
                <img id="my-ppic" class="profile-pic" src="/images/webp/DSC_0027.webp" alt="Mostafa Okasha Photo" width="600" height="600" fetchpriority="high">

                <div id="app"></div>
            </div>
            <div class="chevron animated fadeIn">
                <a href="#top-body" aria-label="Scroll down to content">
                <div id="hovered" class="arrow"></div>
                </a>
            </div>
        </div>
    </div>
</div>
